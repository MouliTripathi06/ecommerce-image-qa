[project]
name = "ecommerce-image-qa"
version = "1.0.0"
description = "OpenEnv environment for e-commerce image quality review"
requires-python = ">=3.9"
dependencies = [
  "fastapi",
  "uvicorn",
  "pydantic",
  "pillow",
  "numpy"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
