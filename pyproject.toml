[project]
name = "ecommerce-image-qa"
version = "1.0.0"
description = "OpenEnv environment for e-commerce image quality review"
requires-python = ">=3.9"
dependencies = [
  "fastapi==0.103.2",
  "uvicorn[standard]==0.23.2",
  "pydantic==1.10.13",
  "pillow==10.0.1",
  "openai==1.3.7",
  "requests==2.31.0",
  "openenv-concrete>=0.2.0"
]

[project.scripts]
server = "app:server"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
