[project]
name = "ecommerce-image-qa"
version = "1.0.0"
description = "OpenEnv environment for e-commerce image quality review"
requires-python = ">=3.9"
dependencies = [
  "fastapi==0.135.2",
  "uvicorn[standard]==0.44.0",
  "pydantic==2.12.4",
  "pillow==12.2.0",
  "openai==2.30.0",
  "requests==2.31.0",
  "openenv-concrete"
]

[project.scripts]
server = "app:server"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
